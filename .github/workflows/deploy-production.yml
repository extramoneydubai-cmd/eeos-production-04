name: Deploy Production — EEOS Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - rc

concurrency:
  group: production-deploy
  cancel-in-progress: false

# Required GitHub secrets:
#   VITE_CONVEX_URL   → https://<your-deployment>.convex.cloud (production deployment)
#   CONVEX_DEPLOY_KEY → deploy key minted from the SAME production deployment in the
#                       Convex dashboard (Deployments → <deployment> → Deploy Keys).
#                       `convex deploy` targets whatever deployment the key is bound to.
# The Vercel deploy job was removed: production frontend is served from the Hostinger
# VPS via Docker (see Dockerfile / docker-compose.yml / nginx.conf).
env:
  NODE_VERSION: "20"
  VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b --noEmit
      - name: Check environment
        run: |
          required_vars="VITE_CONVEX_URL CONVEX_DEPLOY_KEY"
          for var in $required_vars; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required environment variable: $var"
              exit 1
            fi
          done
          echo "✅ All required environment variables are set"
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - run: echo "✅ Pre-deployment validation passed"

  deploy-convex:
    name: Deploy Convex (Production)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy Convex functions
        run: bunx convex deploy --typecheck=disable --cmd-url-env-var-name VITE_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - run: echo "✅ Convex production deployment complete"

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: deploy-convex
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30
      - run: echo "✅ Frontend build complete"

  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "# EEOS Production Release" > release-notes.md
          echo "" >> release-notes.md
          echo "**Date:** $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> release-notes.md
          echo "**Commit:** ${{ github.sha }}" >> release-notes.md
          echo "**Branch:** ${{ github.ref_name }}" >> release-notes.md
          echo "**Release Channel:** ${{ github.event.inputs.release_channel || 'stable' }}" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Modules Deployed" >> release-notes.md
          echo "- CRM (Leads, Sales, Opportunities, Collections)" >> release-notes.md
          echo "- Finance (Dashboard, Invoices, Expenses, Reports)" >> release-notes.md
          echo "- Procurement (Vendors, Inventory, Assets)" >> release-notes.md
          echo "- Student (Database, Workspace, Enrollment, Academic)" >> release-notes.md
          echo "- Employee/HR (Database, Workspace, Leave, Payroll)" >> release-notes.md
          echo "- People Registry, Academic, Calendar, LMS" >> release-notes.md
          echo "- Examination, Communication, Executive Dashboards" >> release-notes.md
          echo "- Analytics, Operations Center, Security Center" >> release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 30

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-convex, build]
    if: always()
    steps:
      - run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
