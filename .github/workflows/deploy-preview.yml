name: Deploy Preview — EEOS Preview Deployment

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

jobs:
  deploy-convex:
    name: Deploy Convex (Preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Deploy Convex functions
        run: npx convex deploy --typecheck=disable --cmd-url-env-var-name VITE_CONVEX_URL --preview-run 'seed:init'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

  vite-build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: deploy-convex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build frontend
        run: npx vite build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: dist/
          retention-days: 7
      - run: echo "✅ Preview build complete"

  verify:
    name: Verify Preview
    runs-on: ubuntu-latest
    needs: vite-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: dist/
      - name: Check output
        run: |
          test -f dist/index.html || { echo "❌ Missing index.html"; exit 1; }
          echo "✅ Preview artifact verified"
      - run: |
          echo "## Preview Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Convex deployment: \`npx convex deploy\`" >> $GITHUB_STEP_SUMMARY
          echo "- Vite build: \`vite build\`" >> $GITHUB_STEP_SUMMARY
          echo "- Preview will be available when this PR is merged" >> $GITHUB_STEP_SUMMARY
