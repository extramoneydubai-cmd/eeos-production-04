name: Deploy Preview — EEOS Preview Deployment

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

jobs:
  deploy-convex:
    name: Deploy Convex (Preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy Convex functions
        # Seed function lives at src/convex/demo/seed.ts → export seedAll
        run: bunx convex deploy --typecheck=disable --cmd-url-env-var-name VITE_CONVEX_URL --preview-run 'demo/seed:seedAll'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

  vite-build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: deploy-convex
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: dist/
          retention-days: 7
      - run: echo "✅ Preview build complete"

  verify:
    name: Verify Preview
    runs-on: ubuntu-latest
    needs: vite-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-build
          path: dist/
      - name: Check output
        run: |
          test -f dist/index.html || { echo "❌ Missing index.html"; exit 1; }
          echo "✅ Preview artifact verified"
      - run: |
          echo "## Preview Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Convex deployment: \`bunx convex deploy\`" >> $GITHUB_STEP_SUMMARY
          echo "- Vite build: \`bun run build\`" >> $GITHUB_STEP_SUMMARY
          echo "- Preview will be available when this PR is merged" >> $GITHUB_STEP_SUMMARY
