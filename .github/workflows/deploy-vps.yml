name: Deploy VPS — Hostinger Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

# Auto-deploys the frontend to the Hostinger VPS whenever code lands on main.
#
# The VPS keeps a clone of this repo at /opt/eeos and rebuilds the Docker image
# there. The Dockerfile bakes VITE_CONVEX_URL from /opt/eeos/.env at build time,
# so the .env on the VPS must already point at the production Convex deployment.
#
# Required GitHub secrets (repo → Settings → Secrets and variables → Actions):
#   VPS_HOST    — VPS IP or domain (e.g. 203.0.113.10)
#   VPS_USER    — SSH user (e.g. root)
#   VPS_SSH_KEY — private SSH key whose public half is in ~/.ssh/authorized_keys
#                 on the VPS (or in root's authorized_keys if VPS_USER=root)
#   VPS_PORT    — optional, defaults to 22
#
# This job is skipped until the secrets above are set.
jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Pull and rebuild on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/eeos
            git remote set-url origin https://github.com/extramoneydubai-cmd/eeos-production-02.git
            git pull --ff-only
            docker compose up -d --build
            docker compose ps
